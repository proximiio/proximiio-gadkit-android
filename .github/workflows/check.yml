# The JVM checks of the library: lint, the unit tests and the debug build. They run on the
# repository's own runner on pallas (infra, 2026-10-28), in a VM that reaches only the internet.
# No secrets: the repository is public. A pull request from a fork runs after a maintainer
# approves it. The UI tests run on a phone, in the Proximi GAD Android app.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, pallas, android]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The image with the JDK and the Android SDK is only on the runner's VM. `container:` would
      # pull it from a registry first, so the step starts it. The files the build writes go back to
      # the runner's user, for the next checkout.
      - name: ./gradlew check assembleDebug
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "$PWD:/work" -w /work \
            pallas/android-ci:jdk17 sh -c \
            './gradlew --console=plain --no-daemon check assembleDebug; status=$?; chown -R "$HOST_UID:$HOST_GID" /work; exit $status'
