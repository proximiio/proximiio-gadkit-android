# Publishes a release to https://maven.eu.proximi.fi/releases/ as io.proximi.gadkit:proximiio-gadkit
# when its tag `X.Y.Z` is pushed, as the map library's release.yml does. `workflow_dispatch` with a tag
# runs it for a tag that is already pushed, for example after a failed run.
#
# It runs on GitHub's runner, not on the pallas runner of check.yml: the Maven secrets never go to pallas.
# MAVEN_USERNAME and MAVEN_PASSWORD are repository secrets, set by the operator with `gh secret set`.
# Only this job reads them, and only in its publish step. A pull request does not start this workflow.
# The repository does not accept a version twice, so a version is published once.
#
# scripts/publish.sh does the same from the operator's computer, if this workflow cannot run.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to publish, for example 1.33.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check the tag, gradle.properties and the README changelog
        run: |
          declared="$(sed -nE 's/^gadkit.version=(.*)$/\1/p' gradle.properties)"
          if [[ "$declared" != "$RELEASE_TAG" ]]; then
            echo "::error::tag $RELEASE_TAG, but gradle.properties has gadkit.version=$declared"
            exit 1
          fi
          if ! grep -qF "### [${RELEASE_TAG}]" README.md; then
            echo "::error::README.md has no '### [${RELEASE_TAG}]' heading"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --console=plain :proximiio-gadkit:testDebugUnitTest

      # Without the configuration cache, so the credentials are not stored in a cache entry.
      - name: Publish to maven.eu.proximi.fi
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew --console=plain --no-configuration-cache :proximiio-gadkit:publishReleasePublicationToProximiioMavenRepository

      - name: Summary
        run: echo "Published https://maven.eu.proximi.fi/releases/io/proximi/gadkit/proximiio-gadkit/${RELEASE_TAG}/" >> "$GITHUB_STEP_SUMMARY"
