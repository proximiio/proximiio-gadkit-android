org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Library version, the only place for it. A release is the git tag of the same name.
gadkit.version=1.12.0

# The Kotlin Gradle plugin registers its build statistics service in the host build and in the
# included build gadkit; with the configuration cache the second registration fails
# ("Cannot set the value of a property of type BuildFusService"). No statistics are collected.
kotlin.internal.collectFUSMetrics=false
